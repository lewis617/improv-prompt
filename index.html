<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Improvisation Practice Tool</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="interval">Interval (seconds):</label>
                <input type="number" id="interval" value="30" min="5" max="300">
            </div>
            <div class="button-group">
                <div class="button-stack">
                    <button id="startBtn">Start Practice</button>
                    <button id="stopBtn" style="display: none;">Stop Practice</button>
                </div>
                <button id="nextBtn" disabled>Next</button>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="display-area">
            <div class="current-prompt" id="currentPrompt">
                <div class="prompt-text">Ready to start...</div>
            </div>
        </div>

        <!-- Playback controls stay pinned above the list -->
        <div class="audio-controls">
            <select id="playMode" class="mode-select" title="Play mode" aria-label="Play mode">
                <option value="random" title="Random">🔀</option>
                <option value="sequential" title="Sequential">🔄</option>
                <option value="repeat" title="Repeat one">🔂</option>
            </select>
            <select id="trackSelect" class="track-select" title="Track" aria-label="Track">
                <!-- Options are generated by JavaScript -->
            </select>
            <div class="button-stack">
                <div class="play-pause-stack">
                    <button class="audio-button icon-button" id="playBtn" title="Play" aria-label="Play">▶️</button>
                    <button class="audio-button icon-button" id="pauseBtn" title="Pause" aria-label="Pause" style="display: none;">⏸️</button>
                    <button class="audio-button icon-button" id="resumeBtn" title="Resume" aria-label="Resume" style="display: none;">▶️</button>
                </div>
                <button class="audio-button icon-button" id="stopAudioBtn" title="Stop" aria-label="Stop" style="display: none;">⏹️</button>
            </div>
            <button class="audio-button icon-button" id="nextTrackBtn" title="Next track" aria-label="Next track" disabled>⏭️</button>
            <input type="range" id="volumeControl" title="Volume" aria-label="Volume" min="0" max="1" step="0.01" value="1">
        </div>

        <!-- Single scrolling surface: current track details, then all ideas -->
        <div class="audio-section">
            <div class="track-details" id="trackDetails" style="display: none;">
                <div class="track-tempo" id="trackTempo"></div>
                <div class="track-chords-container">
                    <table class="chord-table" id="chordTable">
                        <!-- Table content will be generated by JavaScript -->
                    </table>
                </div>
                <div class="scale-hints" id="scaleHints" style="display: none;">
                    <div class="scale-group">
                        <div class="scale-label">Scales</div>
                        <div class="scale-hint">Select a track to show scale hints</div>
                    </div>
                </div>
            </div>

            <!-- Exercise Ideas Section -->
            <div class="exercise-list" id="exerciseList">
                <!-- Exercise list will be generated by JavaScript -->
            </div>
        </div>

        <audio id="audioPlayer" preload="metadata"></audio>
    </div>

    <!-- Tip popup for the current idea: hover with a mouse, tap on a phone -->
    <div class="tooltip" id="tooltip" role="tooltip"></div>

    <script type="module" src="./js/index.js"></script>
</body>
</html>
