<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Improvisation Practice Tool</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Improvisation Prompt</h1>
            <a class="github-link" href="https://github.com/lewis617/improv-prompt" target="_blank" rel="noopener" title="GitHub Repository">
                <svg viewBox="0 0 16 16" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            </a>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="interval">Interval (seconds):</label>
                <input type="number" id="interval" value="30" min="5" max="300">
            </div>
            <div class="button-group">
                <div class="button-stack">
                    <button id="startBtn">Start Practice</button>
                    <button id="stopBtn" style="display: none;">Stop Practice</button>
                </div>
                <button id="nextBtn" disabled>Next</button>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="display-area">
            <div class="current-prompt" id="currentPrompt">
                <h2>Current Exercise</h2>
                <div class="prompt-text">Ready to start...</div>
            </div>
        </div>

        <!-- Audio playback section -->
        <div class="audio-section">
            <div class="section-toggle">
                <div class="toggle-controls">
                    <label>
                        <input type="radio" name="displayMode" value="audio" checked>
                        Tracks
                    </label>
                    <label>
                        <input type="radio" name="displayMode" value="exercises">
                        Ideas
                    </label>
                </div>
            </div>

            <!-- Audio Section -->
            <div id="audioSection" class="content-section">
                <div class="audio-controls">
                <div class="control-group">
                    <label for="playMode">Play Mode:</label>
                    <select id="playMode">
                        <option value="random">🔀 Random</option>
                        <option value="sequential">🔄 Sequential</option>
                        <option value="repeat">🔂 Repeat One</option>
                    </select>
                </div>
                <div class="button-stack">
                    <div class="play-pause-stack">
                        <button class="audio-button" id="playBtn">▶️ Play</button>
                        <button class="audio-button" id="pauseBtn" style="display: none;">⏸️ Pause</button>
                        <button class="audio-button" id="resumeBtn" style="display: none;">▶️ Resume</button>
                    </div>
                    <button class="audio-button" id="stopAudioBtn" style="display: none;">⏹️ Stop</button>
                </div>
                <button class="audio-button" id="nextTrackBtn" disabled>⏭️ Next Track</button>
                <div class="control-group">
                    <label for="volumeControl">🔊 Volume:</label>
                    <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="1">
                </div>
            </div>
            <div class="track-details" id="trackDetails" style="display: none;">
                <div class="track-title" id="trackTitle"></div>
                <div class="track-tempo" id="trackTempo"></div>
                <div class="track-chords-container">
                    <table class="chord-table" id="chordTable">
                        <!-- Table content will be generated by JavaScript -->
                    </table>
                </div>
                <div class="scale-hints" id="scaleHints" style="display: none;">
                    <div class="scale-category">
                        <h4>Primary Scale Options</h4>
                        <div class="scale-list">Select a track to show scale hints</div>
                    </div>
                </div>
            </div>
                <div class="track-list" id="trackList">
                    <!-- Audio list will be generated by JavaScript -->
                </div>
                <audio id="audioPlayer" preload="metadata"></audio>
            </div>

            <!-- Exercise Ideas Section -->
            <div id="exerciseSection" class="content-section" style="display: none;">
                <div class="exercise-list" id="exerciseList">
                    <!-- Exercise list will be generated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./js/index.js"></script>
</body>
</html>
